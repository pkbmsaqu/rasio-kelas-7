<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab Maya Bengkel Rasio — Perbandingan Kelas 7</title>
<style>
*{box-sizing:border-box}
:root{--bg:#eef6f9;--bl:#0b6fa4;--tl:#10a39b;--or:#e8791a;--gr:#1d9a57;--rd:#d65a55;--ink:#14303f;--ln:#cfe0e8}
html,body{margin:0;height:100%;overflow:hidden;background:#d9e8ee;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;transform-origin:center;background:var(--bg);display:grid;grid-template-rows:64px 40px 1fr 56px;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px;border:0;border-radius:12px}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
header{display:grid;grid-template-columns:330px 1fr 250px;align-items:center;gap:16px;padding:0 16px;background:linear-gradient(90deg,#0b5f8d,#10a39b);color:#fff}
header h1{font-size:19px;margin:0;line-height:1.1}header h1 small{display:block;font-weight:400;font-size:12px;opacity:.9}
.logo{display:inline-flex;vertical-align:middle;margin-right:8px}
#pg{background:rgba(255,255,255,.28);border-radius:20px;height:22px;position:relative;overflow:hidden}
#pf{height:100%;width:0;background:var(--or);transition:width .5s}#pt{position:absolute;inset:0;text-align:center;font:700 13px/22px system-ui}
#bd{display:flex;gap:8px;justify-content:flex-end}.bg{width:60px;height:46px;border-radius:12px;background:rgba(255,255,255,.2);font-size:11px;text-align:center;padding-top:3px;opacity:.6}
.bg.on{background:#ffd54a;color:#5b3b00;opacity:1;animation:pop .6s}.bg b{display:block;font-size:20px;line-height:20px}
@keyframes pop{50%{transform:scale(1.2)}}
#steps{display:flex;gap:6px;align-items:center;padding:0 12px;background:#fff;border-bottom:1px solid var(--ln)}
.sp{flex:1;font-size:12px;text-align:center;padding:5px 2px;border-radius:14px;background:#e6eef2;font-weight:600;white-space:nowrap}
.sp.d{background:var(--gr);color:#fff}.sp.c{background:var(--or);color:#fff}
#body{display:grid;grid-template-columns:225px 1fr 440px;gap:10px;padding:8px 10px;min-height:0}
aside,main,section{overflow:auto;min-height:0}
h4{margin:6px 2px 6px;font-size:13px;color:var(--bl)}
.stn,.tool{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:#fff;border:2px solid var(--ln);margin-bottom:6px;padding:6px 8px;font-size:14px;font-weight:700}
.stn.on,.tool.on{border-color:var(--bl);background:#e3f3fb}.stn b{width:30px;height:30px;border-radius:50%;background:var(--bl);color:#fff;display:grid;place-items:center;flex:none}
small{display:block;font-weight:400;font-size:11.5px;color:#4b6676}.ic{display:inline-flex;width:38px;height:38px;flex:none}.ic img{width:38px;height:38px;object-fit:contain}
.card{background:#fff;border-radius:16px;box-shadow:0 3px 12px rgba(11,111,164,.14);padding:12px 14px;margin-bottom:8px}
.card h2{margin:0 0 4px;font-size:18px}.card h3{margin:0 0 6px;font-size:15px}.card p{margin:4px 0;font-size:13.5px;line-height:1.4}
.pill{font-size:11px;padding:2px 8px;border-radius:10px;color:#fff;vertical-align:middle}.pill.senilai{background:var(--tl)}.pill.berbalik{background:var(--or)}
.go{background:var(--or);color:#fff;font-weight:800;padding:0 18px;font-size:15px;box-shadow:0 3px 0 #b85c0f}.sv{background:var(--bl);color:#fff;font-weight:700;padding:0 12px;margin:3px 4px 0 0;font-size:13px}.sv.o{background:var(--or)}.sv.g{background:#e3eef3;color:var(--ink)}
.sm{width:44px;background:#e3f3fb;font-size:20px;font-weight:800;color:var(--bl)}
.row{display:flex;gap:8px;align-items:center}.row input[type=range]{flex:1;height:44px;accent-color:var(--tl)}
label{font-size:13.5px;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid var(--ln);padding:3px 6px;text-align:center}th{background:#e3f3fb}tr.hl td{background:#fff1dc;font-weight:700}td.a{color:var(--bl);font-weight:700}td.b{color:var(--or);font-weight:700}
.const{background:#e7f7ee;border-left:5px solid var(--gr);padding:6px 10px;border-radius:8px;font-weight:700;font-size:13.5px}
.narr{background:#eaf4fb;border-left:5px solid var(--bl);padding:6px 10px;border-radius:8px}
.formula{background:#fff7e8;border:2px dashed var(--or);border-radius:10px;padding:8px;font-weight:800;font-size:15px;text-align:center}
.gr{width:100%;height:auto;display:block;background:#fbfeff;border:1px solid var(--ln);border-radius:10px}.gr text{font-size:10.5px;fill:#456}
#vis{display:flex;flex-wrap:wrap;gap:4px;min-height:84px;align-content:flex-start;background:#f3fafc;border-radius:12px;padding:8px;margin:6px 0}
.it{width:26px;height:26px;border-radius:8px;background:var(--tl)}.it.t{background:var(--or);border-radius:50% 50% 6px 6px}.it.m{width:34px;background:var(--bl);border-radius:6px 14px 6px 6px}.run .it{animation:pop .5s backwards}
.bar{height:26px;background:#e3eef3;border-radius:14px;position:relative;overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--tl),var(--bl));transition:width 1.3s ease}.bar span{position:absolute;inset:0;text-align:center;font:700 13px/26px system-ui;color:#fff;text-shadow:0 1px 2px #0006}
.inp{display:flex;gap:6px;align-items:center;margin:5px 0;flex-wrap:wrap}.inp input[type=number],.inp input[type=text]{width:120px;height:44px;border:2px solid var(--ln);border-radius:10px;padding:0 8px;font-size:16px;font-weight:700}
#mapw,#g3{touch-action:none;user-select:none;-webkit-user-select:none;border-radius:12px;overflow:hidden;border:2px solid var(--ln)}
.pin{cursor:grab}.pre{background:#e3f3fb;color:var(--bl);font-weight:700;padding:0 8px;min-height:36px;margin:2px;font-size:12.5px}
.lenbar{height:16px;border-radius:8px;margin:3px 0}
footer{display:flex;gap:8px;align-items:center;padding:6px 12px;background:#fff;border-top:1px solid var(--ln)}
footer button{background:#e3f3fb;font-weight:700;padding:0 12px;font-size:13px;color:var(--bl)}footer .rs{background:#fdecea;color:#a23b36}
#last{flex:1;font-size:12px;color:#456;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%) translateY(30px);background:#14303f;color:#fff;padding:10px 18px;border-radius:24px;opacity:0;pointer-events:none;transition:.3s;font-weight:700;z-index:30}
#toast.show{opacity:1;transform:translateX(-50%)}#toast.ok{background:var(--gr)}#toast.bad{background:var(--rd)}
#modal{position:absolute;inset:0;background:#0a283a99;display:none;z-index:20;place-items:center}#modal.open{display:grid}
.mb{background:#fff;border-radius:18px;width:860px;max-height:640px;overflow:auto;padding:18px 22px}.mb h2{margin:0 0 8px}
.mb textarea{width:100%;min-height:58px;border:2px solid var(--ln);border-radius:10px;padding:8px;font-size:14px}
.q{margin:8px 0;padding:8px 10px;border:1px solid var(--ln);border-radius:12px}.q button{display:block;width:100%;text-align:left;background:#eef6f9;margin:4px 0;padding:0 12px;font-size:14px}
.q button.ok{background:#c8f0d9}.q button.no{background:#fbd3d0}.fb{font-size:13px;font-weight:700;margin-top:4px}
ol.ob{font-size:13.5px;line-height:1.5;padding-left:20px}.empty{text-align:center;padding:40px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{html,body{overflow:visible;background:#fff}#stage{position:static;transform:none!important;margin:0;width:auto;height:auto;display:block}#stage>*:not(#modal){display:none}#modal{position:static;display:block!important;background:none}.mb{width:auto;max-height:none;overflow:visible}.np{display:none}}
</style>
</head>
<body>
<div id="stage">
<header><h1><span class="logo" data-a="./assets/img/logo.png"><svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#fff"/><path d="M8 28L20 8l12 20z" fill="#e8791a"/><circle cx="20" cy="24" r="5" fill="#0b6fa4"/></svg></span>Bengkel Rasio<small>Lab Maya Perbandingan · Matematika Kelas 7</small></h1>
<div id="pg" role="progressbar" aria-label="Progres eksperimen" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="pf"></div><div id="pt">0%</div></div><div id="bd"></div></header>
<nav id="steps" aria-label="Langkah eksperimen"></nav>
<div id="body"><aside id="side" aria-label="Stasiun dan alat"></aside><main id="main" aria-live="polite"></main><section id="res" aria-label="Hasil"></section></div>
<footer><button onclick="openM('obs')">📋 Lembar Observasi</button><button onclick="openM('con')">✍ Kesimpulan</button><button onclick="openM('quiz')">❓ Uji Pemahaman</button><div id="last">Belum ada pengamatan. Mulai dari stasiun mana saja.</div><button class="rs" onclick="resetSt()">↺ Reset Stasiun</button><button class="rs" onclick="resetAll()">⟲ Reset Semua</button></footer>
<div id="toast" role="status"></div>
<div id="modal" onclick="if(event.target==this)closeM()"><div class="mb" role="dialog" aria-modal="true" id="mbody"></div></div>
</div>
<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const nf=v=>{try{return(+(+v).toFixed(2)).toLocaleString('id-ID',{maximumFractionDigits:2})}catch(e){return''+v}};
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let st=1,T={},STP={},OBS=[],F={1:{},2:null,3:{},c:{}},REFL=['','',''],QA=[];
const SC={kue:{t:'Resep Kue',ic:'cake',type:'senilai',xl:'Jumlah porsi',xu:'porsi',yl:'Tepung',yu:'g',f:x=>50*x,min:1,max:20,def:4,xs:[2,4,6,8,10],story:'Resep: 1 porsi kue memerlukan 50 g tepung. Atur jumlah porsi dan lihat kebutuhan tepung.'},
tukang:{t:'Proyek Tukang Bangunan',ic:'tukang',type:'berbalik',xl:'Jumlah pekerja',xu:'orang',yl:'Waktu selesai',yu:'hari',f:x=>72/x,min:1,max:24,def:6,xs:[2,3,4,6,8,12],story:'Satu proyek selesai dalam 12 hari oleh 6 pekerja (beban kerja 72 orang-hari). Atur jumlah pekerja.'},
mobil:{t:'Perjalanan Mobil',ic:'mobil',type:'senilai',xl:'Kecepatan',xu:'km/jam',yl:'Jarak tempuh 2 jam',yu:'km',f:x=>2*x,min:20,max:120,def:60,step:10,xs:[40,60,80,100,120],story:'Mobil melaju selama 2 jam dengan kecepatan tetap. Atur kecepatan dan lihat jarak yang ditempuh.'}};
const S1={tool:null,x:4,A:null,B:null,res:null,cmp:false};
const S2={tools:{},cm:4,n:250000,A:null,B:null,pa:{x:110,y:240},pb:{x:238,y:144},cmp:false,ran:false};
const S3={mode:null,k:6,x:4,A:null,B:null,ran:false,both:false,cmp:false,q:null,anim:false};
let MAPIMG=null;
const ICS={cake:'<circle cx="20" cy="22" r="14" fill="#f6c27a"/><rect x="8" y="16" width="24" height="10" rx="3" fill="#e8791a"/><circle cx="20" cy="10" r="3" fill="#d65a55"/>',
tukang:'<rect x="5" y="28" width="30" height="7" fill="#0b6fa4"/><rect x="9" y="9" width="6" height="19" fill="#e8791a"/><rect x="5" y="5" width="22" height="7" rx="2" fill="#556"/>',
mobil:'<rect x="3" y="17" width="34" height="12" rx="4" fill="#0b6fa4"/><rect x="10" y="9" width="18" height="10" rx="3" fill="#7cc4e8"/><circle cx="12" cy="31" r="4" fill="#222"/><circle cx="28" cy="31" r="4" fill="#222"/>',
ruler:'<rect x="3" y="14" width="34" height="12" rx="2" fill="#f6c453" stroke="#8a6a00"/><path d="M9 14v6M15 14v4M21 14v6M27 14v4M33 14v6" stroke="#8a6a00"/>',
pin:'<path d="M20 36C10 24 8 20 8 15a12 12 0 0124 0c0 5-2 9-12 21z" fill="#d65a55"/><circle cx="20" cy="15" r="5" fill="#fff"/>',
map:'<rect x="4" y="6" width="32" height="28" rx="3" fill="#cfe8c4" stroke="#4d8a5a"/><path d="M4 24c10-8 16 6 32-4" stroke="#5db4e6" stroke-width="4" fill="none"/>',
lin:'<path d="M5 35L35 6" stroke="#0b6fa4" stroke-width="4"/><path d="M5 5v30h30" stroke="#456" fill="none"/>',
hyp:'<path d="M7 6C9 28 20 33 35 34" stroke="#e8791a" stroke-width="4" fill="none"/><path d="M5 5v30h30" stroke="#456" fill="none"/>'};
const ic=n=>'<svg viewBox="0 0 40 40" width="38" height="38" aria-hidden="true">'+ICS[n]+'</svg>';
function tryAsset(s,ok){const i=new Image();i.onload=()=>ok(s);i.src=s}
function assets(){$$('[data-a]').forEach(e=>tryAsset(e.dataset.a,s=>{e.innerHTML='<img src="'+s+'" alt="">'}))}
tryAsset('./assets/img/peta-rimba.png',s=>{MAPIMG=s;if(st==2)drawMap()});
function snd(n){try{const a=new Audio('./assets/audio/'+n+'.mp3');a.onerror=()=>{};const p=a.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
function toast(m,c){const t=$('#toast');t.textContent=m;t.className='show '+(c||'');clearTimeout(toast.i);toast.i=setTimeout(()=>t.className='',2300)}
function mark(k){if(!T[k]){T[k]=1;toast('Langkah valid selesai ✓','ok')}prog()}
function step(n){STP[n]=1;steps()}
function obs(s,t){OBS.push('Stasiun '+s+' — '+t);$('#last').textContent='Pengamatan terbaru: '+t}
const STN=['st','pick','set','run','obs','save','cmp','conc'],STL=['Pilih Stasiun','Pilih Alat/Bahan','Atur Variabel','Jalankan Simulasi','Amati Hasil','Simpan Skenario','Bandingkan','Tulis Kesimpulan'];
function steps(){let c=STN.findIndex(n=>!STP[n]);$('#steps').innerHTML=STN.map((n,i)=>`<div class="sp ${STP[n]?'d':i==c?'c':''}">${i+1}. ${STL[i]}</div>`).join('')}
function prog(){const p=Math.round(Object.keys(T).length/20*100);$('#pf').style.width=p+'%';$('#pt').textContent=p+'%';$('#pg').setAttribute('aria-valuenow',p);
const nm=['Dapur','Peta','Grafik'];$('#bd').innerHTML=[1,2,3].map(i=>{const on=['pick','set','run','A','B','cmp'].every(k=>T[i+':'+k]);return`<div class="bg ${on?'on':''}" title="Medali ${nm[i-1]}"><b>${on?'★':'☆'}</b>${nm[i-1]}</div>`}).join('')}
function go(n){st=n;step('st');render()}
function render(){side();[m1,m2,m3][st-1]();[r1,r2,r3][st-1]()}
function tool(n,l,d,on,fn){return`<button class="tool ${on?'on':''}" aria-pressed="${!!on}" onclick="${fn}"><span class="ic" data-a="./assets/img/${n}.png">${ic(n)}</span><span>${l}<small>${d}</small></span></button>`}
function side(){let h='<h4>Stasiun</h4>';[['Dapur Rasio','Senilai & berbalik nilai'],['Peta Rimba','Skala dan peta'],['Mesin Grafik & Rumus','Grafik dan aljabar']].forEach((a,i)=>h+=`<button class="stn ${st==i+1?'on':''}" onclick="go(${i+1})"><b>${i+1}</b><span>${a[0]}<small>${a[1]}</small></span></button>`);
h+='<h4>Pilih Alat / Bahan</h4>';
if(st==1)h+=Object.keys(SC).map(k=>tool(SC[k].ic,SC[k].t,SC[k].type=='senilai'?'Senilai':'Berbalik nilai',S1.tool==k,`pick1('${k}')`)).join('');
if(st==2)h+=[['ruler','Penggaris Peta','Tampilkan ukuran cm','ruler'],['pin','Pin Titik A–B','Aktifkan untuk menggeser','pin'],['map','Peta Rimba','Peta bawaan','peta']].map(a=>tool(a[0],a[1],a[2],S2.tools[a[3]],`tg2('${a[3]}')`)).join('');
if(st==3)h+=tool('lin','y = k·x','Senilai: garis lurus',S3.mode=='lin',"pick3('lin')")+tool('hyp','y = k/x','Berbalik nilai: hiperbola',S3.mode=='hyp',"pick3('hyp')");
$('#side').innerHTML=h;assets()}
/* ===== grafik umum ===== */
function graph(o){const w=o.w,h=o.h,m={l:44,r:12,t:12,b:32};const X=x=>m.l+(x-o.x0)/(o.x1-o.x0)*(w-m.l-m.r),Y=y=>h-m.b-y/o.y1*(h-m.t-m.b);
let s=`<svg viewBox="0 0 ${w} ${h}" class="gr" role="img" aria-label="${o.al||'Grafik'}"><defs><clipPath id="c${o.id}"><rect x="${m.l}" y="${m.t-2}" width="${w-m.l-m.r+4}" height="${h-m.t-m.b+4}"/></clipPath></defs>`;
for(let i=0;i<=4;i++){const gy=o.y1*i/4,gx=o.x0+(o.x1-o.x0)*i/4;s+=`<line x1="${m.l}" x2="${w-m.r}" y1="${Y(gy)}" y2="${Y(gy)}" stroke="#dde9ee"/><text x="${m.l-4}" y="${Y(gy)+4}" text-anchor="end">${nf(gy)}</text><line y1="${m.t}" y2="${h-m.b}" x1="${X(gx)}" x2="${X(gx)}" stroke="#eef4f7"/><text x="${X(gx)}" y="${h-m.b+14}" text-anchor="middle">${nf(gx)}</text>`}
s+=`<path d="M${m.l} ${m.t}V${h-m.b}H${w-m.r}" stroke="#345" fill="none" stroke-width="1.5"/><text x="${w-m.r}" y="${h-4}" text-anchor="end">${o.xl||'x'}</text><text x="${m.l+4}" y="${m.t+8}">${o.yl||'y'}</text>`;
o.ser.forEach(e=>{let d='';for(let i=0;i<=90;i++){const x=o.x0+(o.x1-o.x0)*i/90,y=e.f(x);d+=(i?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1)}
s+=`<g clip-path="url(#c${o.id})"><path d="${d}" fill="none" stroke="${e.c}" stroke-width="3" ${o.anim?'pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;animation:dd 1.1s forwards"':''}/></g>`;
(e.pts||[]).forEach(p=>s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3.5" fill="${e.c}"/>`);
if(e.hl)s+=`<circle cx="${X(e.hl[0])}" cy="${Y(e.hl[1])}" r="${e.big?11:6.5}" fill="${e.big?'#e8791a':e.c}" stroke="#fff" stroke-width="2.5"/>`});
return{svg:s+'</svg>',m}}
document.head.insertAdjacentHTML('beforeend','<style>@keyframes dd{to{stroke-dashoffset:0}}</style>');
const kc=(c,x,y)=>c.type=='senilai'?'y ÷ x = '+nf(y)+' ÷ '+nf(x)+' = '+nf(y/x):'x × y = '+nf(x)+' × '+nf(y)+' = '+nf(x*y);
function g1(k,x,y,col,w,h,id){const c=SC[k];const xs=[...new Set([...c.xs,x])].sort((a,b)=>a-b);
return graph({w,h,id,x0:c.min,x1:c.max,y1:c.type=='senilai'?c.f(c.max):c.f(c.min),xl:c.xu,yl:c.yu,al:'Grafik '+c.t,ser:[{f:c.f,c:col,pts:xs.map(v=>[v,c.f(v)]),hl:[x,y]}]}).svg}
/* ===== STASIUN 1 ===== */
function pick1(k){S1.tool=k;S1.x=SC[k].def;S1.res=null;S1.cmp=false;mark('1:pick');step('pick');render()}
function m1(){const k=S1.tool;if(!k)return $('#main').innerHTML='<div class="card empty"><h2>Dapur Rasio</h2><p>Pilih satu kartu skenario di kolom kiri untuk memulai percobaan.</p></div>';
const c=SC[k];$('#main').innerHTML=`<div class="card"><h2>${c.t} <span class="pill ${c.type}">${c.type=='senilai'?'Senilai':'Berbalik nilai'}</span></h2><p>${c.story}</p><div id="vis" aria-hidden="true"></div><div class="bar"><i id="fl"></i><span id="bl">Tekan Jalankan Simulasi</span></div>
<label for="sl">${c.xl}: <b id="xv">${S1.x}</b> ${c.xu}</label><div class="row"><button class="sm" aria-label="Kurangi" onclick="nud1(-1)">−</button><input id="sl" type="range" min="${c.min}" max="${c.max}" step="${c.step||1}" value="${S1.x}" oninput="set1(this.value)"><button class="sm" aria-label="Tambah" onclick="nud1(1)">+</button></div>
<p style="text-align:center"><button class="go" onclick="run1()">▶ Jalankan Simulasi</button></p></div>`;vis()}
function vis(){const k=S1.tool,n=k=='mobil'?Math.round(S1.x/10):Math.min(S1.x,24),cls=k=='tukang'?'t':k=='mobil'?'m':'';$('#vis').innerHTML=Array.from({length:n},(_,i)=>`<span class="it ${cls}" style="animation-delay:${i*40}ms"></span>`).join('')}
function nud1(d){const c=SC[S1.tool],v=cl(S1.x+d*(c.step||1),c.min,c.max);$('#sl').value=v;set1(v)}
function set1(v){S1.x=+v;S1.res=null;S1.cmp=false;mark('1:set');step('set');$('#xv').textContent=v;vis();$('#fl').style.width='0';$('#bl').textContent='Tekan Jalankan Simulasi';r1()}

el.innerHTML=`<div class="card"><h3>Perbandingan Dua Kurva</h3><table><tr><th></th><th style="color:#0b6fa4">A</th><th style="color:#e8791a">B</th></tr><tr><th>Persamaan</th><td class="a">${eq(a.mode,a.k)}</td><td class="b">${eq(b.mode,b.k)}</td></tr><tr><th>Bentuk</th><td>${a.mode=='lin'?'Garis lurus':'Hiperbola'}</td><td>${b.mode=='lin'?'Garis lurus':'Hiperbola'}</td></tr>${[1,2,4].map(v=>`<tr><th>x = ${v}</th><td>${nf(f3(a.mode,a.k,v))}</td><td>${nf(f3(b.mode,b.k,v))}</td></tr>`).join('')}</table>${r.svg}<p class="narr">${F.c[3]}</p>${sb}</div>`;return}
let h=`<div class="card"><h3>Panel Aljabar</h3><p class="formula">${eq(m,k)}</p><p class="const">Jika x = ${x}, maka y = ${m=='lin'?k+' × '+x:k+' ÷ '+x} = ${nf(y)}</p>
<div class="row"><span>x =</span><button class="sm" aria-label="Kurangi x" onclick="S3.x=cl(S3.x-1,1,10);chg3()">−</button><b>${x}</b><button class="sm" aria-label="Tambah x" onclick="S3.x=cl(S3.x+1,1,10);chg3()">+</button></div>`;
if(S3.ran){h+=`<table style="margin-top:6px"><tr><th>x</th>${[1,2,3,4,5,6].map(v=>`<td>${v}</td>`).join('')}</tr><tr><th>y</th>${[1,2,3,4,5,6].map(v=>`<td>${nf(f3(m,k,v))}</td>`).join('')}</tr></table><p class="narr">${m=='lin'?'Setiap x bertambah 1, y bertambah '+k+'. Grafik: garis lurus melalui titik asal.':'Saat x makin besar, y makin kecil; x × y selalu '+k+'. Grafik: kurva hiperbola.'}</p>`}else h+='<p class="narr">Tekan Jalankan Simulasi untuk menampilkan tabel nilai.</p>';
h+=`<h3 style="margin-top:8px">Soal Isian Singkat</h3>`+(S3.q?`<p><b>${S3.q.t}</b></p><div class="inp"><input id="ans" type="text" inputmode="decimal" aria-label="Jawaban" onkeydown="if(event.key=='Enter')ck3()"><button class="sv" onclick="ck3()">Periksa</button><button class="sv g" onclick="nq()">Soal lain</button></div>`:`<button class="sv" onclick="nq()">Buat soal untuk ${eq(m,k)}</button>`);
el.innerHTML=h+`<div>${sb}</div></div>`}
/* ===== Modal ===== */
function openM(w){const b=$('#mbody');
if(w=='obs')b.innerHTML=`<h2>📋 Lembar Observasi</h2>${OBS.length?'<ol class="ob">'+OBS.map(o=>'<li>'+o+'</li>').join('')+'</ol>':'<p>Belum ada pengamatan. Jalankan simulasi di salah satu stasiun.</p>'}<button class="sv np" onclick="closeM()">Tutup</button>`;
if(w=='con'){const t=concl();b.innerHTML=`<h2>✍ Kesimpulan Eksperimen</h2><p id="ct" style="white-space:pre-wrap;font-size:14px;line-height:1.5">${t}</p><h3>Pertanyaan Refleksi</h3>${['Berikan satu contoh sehari-hari perbandingan senilai dan satu contoh berbalik nilai, lalu jelaskan perbedaannya.','Bagaimana skala membantumu mengubah jarak pada peta menjadi jarak sebenarnya (dan sebaliknya)?','Apa perbedaan grafik dan persamaan y = kx dengan y = k/x?'].map((q,i)=>`<p style="margin:6px 0 2px"><label for="rf${i}">${i+1}. ${q}</label></p><textarea id="rf${i}" oninput="REFL[${i}]=this.value">${REFL[i]}</textarea>`).join('')}
<p class="np"><button class="go" onclick="svC()">💾 Simpan Kesimpulan</button> <button class="sv" onclick="window.print()">🖨 Cetak</button> <button class="sv" onclick="dlC()">⬇ Unduh (.txt)</button> <button class="sv g" onclick="closeM()">Tutup</button></p>`}
if(w=='quiz'){b.innerHTML=`<h2>❓ Uji Pemahaman</h2><div id="qz"></div><button class="sv g np" onclick="closeM()">Tutup</button>`;qz()}
$('#modal').className='open'}
function closeM(){$('#modal').className=''}
function concl(){const L=['KESIMPULAN EKSPERIMEN — BENGKEL RASIO'];const k1=Object.keys(F[1]);
L.push('\nStasiun 1 — Dapur Rasio: '+(k1.length?'':'belum ada data.'));k1.forEach(k=>L.push('• '+SC[k].t+': '+F[1][k]));if(F.c[1])L.push('• Perbandingan: '+F.c[1]);
L.push('\nStasiun 2 — Peta Rimba: '+(F[2]?F[2]:'belum ada data.'));if(F.c[2])L.push('• Perbandingan: '+F.c[2]);
L.push('\nStasiun 3 — Mesin Grafik & Rumus: '+(Object.keys(F[3]).length?'':'belum ada data.'));Object.keys(F[3]).forEach(m=>L.push('• '+F[3][m]));if(F.c[3])L.push('• Perbandingan: '+F.c[3]);
L.push('\nTemuan umum: pada perbandingan senilai, y ÷ x tetap dan grafiknya garis lurus melalui titik asal; pada perbandingan berbalik nilai, x × y tetap dan grafiknya hiperbola. Skala 1 : n berarti jarak sebenarnya = jarak pada peta × n.');return L.join('\n')}
function svC(){if(REFL.filter(r=>r.trim().length>=10).length<1)return toast('Tulis minimal satu jawaban refleksi (10 huruf atau lebih).','bad');mark('conc');step('conc');toast('Kesimpulan tersimpan','ok')}
function dlC(){const t=concl()+'\n\nREFLEKSI\n'+REFL.map((r,i)=>(i+1)+'. '+r).join('\n')+'\n\nSKOR UJI PEMAHAMAN: '+QA.filter(a=>a&&a.ok).length+'/5';const b=new Blob([t],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kesimpulan-bengkel-rasio.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Berkas diunduh','ok')}
const QZ=[['Resep kue: 4 porsi memerlukan 200 g tepung. Untuk 10 porsi diperlukan tepung ...',['400 g','600 g','500 g','800 g'],2,'Senilai: 200 ÷ 4 = 50 g per porsi; 50 × 10 = 500 g.'],
['6 pekerja menyelesaikan proyek dalam 12 hari. Jika ada 9 pekerja, proyek selesai dalam ...',['6 hari','10 hari','18 hari','8 hari'],3,'Berbalik nilai: 6 × 12 = 72; 72 ÷ 9 = 8 hari.'],
['Skala peta 1 : 250.000 dan jarak pada peta 4 cm. Jarak sebenarnya adalah ...',['1 km','10 km','25 km','100 km'],1,'4 × 250.000 = 1.000.000 cm = 10 km.'],
['Pada persamaan y = 6x, jika x = 4 maka y = ...',['10','20','24','64'],2,'y = 6 × 4 = 24.'],
['Jarak sebenarnya 15 km dan skala 1 : 500.000. Jarak pada peta adalah ...',['3 cm','7,5 cm','30 cm','0,3 cm'],0,'15 km = 1.500.000 cm; 1.500.000 ÷ 500.000 = 3 cm.']];
function qz(){const sc=QA.filter(a=>a&&a.ok).length,dn=QA.filter(a=>a).length;$('#qz').innerHTML=QZ.map((q,i)=>`<div class="q"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<button onclick="ans(${i},${j})" ${QA[i]?'disabled':''} class="${QA[i]?(j==q[2]?'ok':QA[i].j==j?'no':''):''}">${'ABCD'[j]}. ${o}</button>`).join('')}${QA[i]?`<div class="fb" style="color:${QA[i].ok?'#1d9a57':'#d65a55'}">${QA[i].ok?'Benar! ':'Belum tepat. '}${q[3]}</div>`:''}</div>`).join('')+`<p><b>Skor: ${sc} / 5</b>${dn==5?' — Selesai!':''}</p>`}
function ans(i,j){if(QA[i])return;QA[i]={j,ok:j==QZ[i][2]};snd(QA[i].ok?'benar':'salah');if(QA.filter(a=>a).length==5)mark('quiz');qz()}
function resetSt(){Object.keys(T).filter(k=>k.startsWith(st+':')).forEach(k=>delete T[k]);OBS=OBS.filter(o=>!o.startsWith('Stasiun '+st));
if(st==1){Object.assign(S1,{tool:null,x:4,A:null,B:null,res:null,cmp:false});F[1]={};delete F.c[1]}
if(st==2){Object.assign(S2,{tools:{},cm:4,n:250000,A:null,B:null,pa:{x:110,y:240},pb:{x:238,y:144},cmp:false,ran:false});F[2]=null;delete F.c[2]}
if(st==3){Object.assign(S3,{mode:null,k:6,x:4,A:null,B:null,ran:false,both:false,cmp:false,q:null});F[3]={};delete F.c[3]}
prog();render();toast('Stasiun '+st+' direset')}
function resetAll(){T={};STP={};OBS=[];F={1:{},2:null,3:{},c:{}};REFL=['','',''];QA=[];Object.assign(S1,{tool:null,x:4,A:null,B:null,res:null,cmp:false});Object.assign(S2,{tools:{},cm:4,n:250000,A:null,B:null,pa:{x:110,y:240},pb:{x:238,y:144},cmp:false,ran:false});Object.assign(S3,{mode:null,k:6,x:4,A:null,B:null,ran:false,both:false,cmp:false,q:null});
st=1;$('#last').textContent='Belum ada pengamatan. Mulai dari stasiun mana saja.';prog();steps();render();toast('Semua data direset')}
function fit(){$('#stage').style.transform='scale('+Math.min(innerWidth/1280,innerHeight/720)+')'}
addEventListener('resize',fit);addEventListener('keydown',e=>{if(e.key=='Escape')closeM()});
fit();prog();steps();render();assets();
</script>
